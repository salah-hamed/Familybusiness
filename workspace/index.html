<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مساحة العمل</title>

<link rel="stylesheet" href="../core/ui/theme.css">
<link rel="stylesheet" href="./style.css">

</head>

<body>

<div class="container">

<header>

<h1>👋 أهلاً بك</h1>

<p id="userName">
جاري التحميل...
</p>

</header>

<section class="subscriptionCard">

<h2>اشتراكك</h2>

<p id="subscriptionStatus">

جاري التحقق...

</p>

</section>

<section class="referralCard">

<h2>برنامج الإحالة</h2>

<p>شارك رابطك، وبعد تفعيل المستخدم الجديد تحصل على 50 جنيه عمولة إحالة.</p>

<div class="referralLinkRow">
<input id="referralLink" type="text" readonly value="جاري تجهيز رابط الإحالة...">
<button id="copyReferralBtn" type="button">نسخ الرابط</button>
</div>

<p id="referralStatus"></p>

</section>

<section class="earningsCard">
<h2>أرباحك وعمولاتك</h2>
<div class="earningsStats">
  <div><span>إجمالي الأرباح</span><strong id="earningsTotal">0 جنيه</strong></div>
  <div><span>عمولات الطلبات</span><strong id="earningsProjects">0 جنيه</strong></div>
  <div><span>عمولات الإحالة</span><strong id="earningsReferrals">0 جنيه</strong></div>
  <div><span>عدد الحركات</span><strong id="earningsCount">0</strong></div>
</div>
<div id="earningsList" class="earningsList"><p>جاري تحميل الأرباح...</p></div>
<button id="loadMoreEarningsBtn" class="earningsLoadMore hidden" type="button">عرض حركات أقدم</button>
<p id="earningsMessage"></p>
</section>

<section>

<h2>

🚀 الخدمات المتاحة

</h2>

<div id="templatesContainer">

جاري تحميل الخدمات...

</div>

</section>

</div>

<script type="module" src="./app.js"></script>

</body>

</html>
