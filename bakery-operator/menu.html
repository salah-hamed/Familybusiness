<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#D97706">
  <title>إدارة منتجات المخبز | Family Business</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div>
      <span class="eyebrow">Family Business · Bakery</span>
      <h1>🥐 إدارة المنيو والأسعار</h1>
      <p id="pageStatus">جاري تحميل المنيو...</p>
    </div>
    <a id="backToDashboard" class="ghost tabLink" href="./">الرجوع للوحة التشغيل</a>
  </header>

  <section id="menuPanel" class="hidden">
    <section class="card">
      <span class="eyebrow">إضافة صنف</span>
      <h2>أضف منتجًا للمخبز</h2>
      <div class="formGrid three">
        <label>اسم الصنف<input id="itemName" placeholder="مثال: فينو سمسم"></label>
        <label>التصنيف<input id="itemCategory" list="bakeryCategories" placeholder="فينو، بقسماط، فطير، باتيه، كرواسون..."></label>
        <label>وحدة البيع
          <select id="itemUnit">
            <option value="قطعة">قطعة</option>
            <option value="كيس">كيس</option>
            <option value="دستة">دستة</option>
            <option value="كيلو">كيلو</option>
            <option value="علبة">علبة</option>
            <option value="صينية">صينية</option>
          </select>
        </label>
        <label>السعر<input id="itemPrice" type="number" min="0" step="0.5"></label>
        <label>وصف مختصر<input id="itemDescription" placeholder="وصف المنتج أو الحشو أو الحجم"></label>
        <label>رابط الصورة<input id="itemImage" placeholder="https://..."></label>
      </div>
      <datalist id="bakeryCategories">
        <option value="فينو">
        <option value="خبز">
        <option value="بقسماط">
        <option value="باتيه">
        <option value="كرواسون">
        <option value="فطير">
        <option value="معجنات">
        <option value="كيك وحلويات">
        <option value="بوكسات وعروض">
      </datalist>
      <div class="menuDraftPreview">
        <div id="newItemImagePreview" class="menuItemThumb">🥐</div>
        <div>
          <b>معاينة صورة الصنف</b>
          <p class="muted">استخدم رابط صورة مباشر HTTPS. لو الموقع يمنع العرض الخارجي هنبلغك قبل الحفظ.</p>
        </div>
      </div>
      <button id="addItemBtn" class="primary">إضافة للمنيو</button>
      <p id="itemMessage" class="message"></p>
    </section>

    <section class="card">
      <div class="sectionHead">
        <div><span class="eyebrow">منتجات المخبز</span><h2>المنتجات والأسعار</h2></div>
        <input id="menuSearch" type="search" placeholder="ابحث عن منتج...">
      </div>
      <div id="menuList" class="stack"></div>
    </section>
  </section>
</main>
<script type="module" src="./menu.js"></script>
</body>
</html>
