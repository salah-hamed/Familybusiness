<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data: https:; frame-src https://www.google.com https://www.recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="fb-pwa-surface" content="platform">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./pwa/manifest.json">
  <link rel="apple-touch-icon" href="./pwa/icons/icon-192.png">
  <link rel="stylesheet" href="./pwa/install.css">
  <link rel="stylesheet" href="/Familybusiness/core/ui/theme.css">
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابدأ بناء شركتك | Family Business</title>
</head>
<body>
<div class="auth-card">
  <div class="logo-box">

    <div class="logo-icon">

        FB

    </div>

    <h2>

        Family Business

    </h2>

  </div>
  <h1 id="pageTitle">ابدأ بناء شركتك</h1>

<p>
أنت على بُعد دقيقة واحدة من امتلاك شركتك.
</p>
<div id="nameGroup">
<input type="text" id="name" placeholder="الاسم" autocomplete="name" aria-label="الاسم">
</div>

<input type="email" id="email" placeholder="البريد الإلكتروني" autocomplete="email" inputmode="email" aria-label="البريد الإلكتروني">


<input type="password" id="password" placeholder="كلمة المرور" autocomplete="new-password" aria-label="كلمة المرور">
<div id="confirmPasswordGroup">
  <input
    type="password"
    id="confirmPassword"
    placeholder="تأكيد كلمة المرور"
    autocomplete="new-password"
    aria-label="تأكيد كلمة المرور">
</div>

<button id="forgotPasswordBtn" class="text-action hidden" type="button">نسيت كلمة المرور؟</button>

<button id="registerBtn">
    🚀 امتلك شركتك
</button>

<p class="switch-mode">

    <span id="switchPrompt">لديك حساب بالفعل؟</span>

    <a href="#" id="loginBtn">

        تسجيل الدخول

    </a>

</p>

<button id="logoutBtn">
    تسجيل الخروج
</button>

<a id="platformSupportWhatsapp" class="support-link" href="#" target="_blank" rel="noopener">
  دعم وتفعيل Family Business عبر واتساب
</a>

  <p id="status"></p>
</div>

<script type="module" src="app.js"></script>
  <script type="module" src="./pwa/install.js"></script>
</body>
</html>
