name: FB-LAUNCH09A validation
on:
  push:
    branches:
      - fb-launch09a-owner-auth-recovery

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax checks
        run: |
          node --check core/auth/auth.js
          node --check core/auth/auth-errors.js
          node --check app.js
          node --check core/onboarding/guide-state.js
      - name: Full test suite
        run: npm test
