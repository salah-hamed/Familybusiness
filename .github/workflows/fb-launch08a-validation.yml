name: FB-LAUNCH08A validation
on:
  push:
    branches:
      - fb-launch08a-operator-first-run

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax checks
        run: |
          node --check core/onboarding/guide-state.js
          node --check supermarket-operator/app.js
          node --check restaurant-operator/app.js
          node --check bakery-operator/app.js
          node --check laundry-operator/app.js
      - name: Full test suite
        run: npm test
