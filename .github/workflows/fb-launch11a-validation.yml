name: FB-LAUNCH11A validation
on:
  push:
    branches:
      - fb-launch11a-laundry-customer-tracking

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax and config checks
        run: |
          node --check core/laundry/order-service.js
          node --check templates/laundry/app.js
          node --check templates/laundry/orders.js
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8')); JSON.parse(require('fs').readFileSync('firebase.json','utf8')); console.log('config ok')"
      - name: Full test suite
        run: npm test
