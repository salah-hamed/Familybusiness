name: FB-LAUNCH03 Peer Settlement Validation
on:
  push:
    branches:
      - fb-launch03-peer-settlement-finance

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node --check core/commissions/settlement-service.js
      - run: node --check core/commissions/finance-panel.js
      - run: node --check core/commissions/earnings-service.js
      - run: node --check admin/admin.js
      - run: node --check supermarket/app.js
      - run: node --check restaurant/app.js
      - run: node --check bakery/app.js
      - run: node --check laundry/app.js
      - run: node --check supermarket-operator/app.js
      - run: node --check restaurant-operator/app.js
      - run: node --check bakery-operator/app.js
      - run: node --check laundry-operator/app.js
      - run: node --check tests/firestore.rules.test.mjs
      - run: node --check tests/source-regressions.test.mjs
      - run: node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"
      - run: npm test
