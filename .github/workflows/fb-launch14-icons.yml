name: FB-LAUNCH14 generate PWA icons
on:
  push:
    branches:
      - fb-launch14-pwa-installable-apps

permissions:
  contents: write

jobs:
  icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb-launch14-pwa-installable-apps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate PWA PNG icons
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          out = Path("pwa/icons")
          out.mkdir(parents=True, exist_ok=True)
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          for size in (192, 512):
              img = Image.new("RGBA", (size, size), "#16a34a")
              draw = ImageDraw.Draw(img)
              pad = round(size * 0.14)
              radius = round(size * 0.20)
              draw.rounded_rectangle(
                  (pad, pad, size-pad, size-pad),
                  radius=radius,
                  fill="#15803d"
              )
              inner = round(size * 0.28)
              draw.ellipse((inner, inner, size-inner, size-inner), fill="#1f9d4d")
              font = ImageFont.truetype(font_path, round(size * 0.30))
              text = "FB"
              box = draw.textbbox((0, 0), text, font=font)
              w, h = box[2]-box[0], box[3]-box[1]
              draw.text(
                  ((size-w)/2, (size-h)/2 - round(size*0.025)),
                  text,
                  font=font,
                  fill="white"
              )
              img.save(out / f"icon-{size}.png", optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/icons/icon-192.png pwa/icons/icon-512.png
          if git diff --cached --quiet; then
            echo "Icons already current"
          else
            git commit -m "FB-LAUNCH14: generate installable PWA icons"
            git push origin HEAD:fb-launch14-pwa-installable-apps
          fi
