name: FB-LAUNCH13 E2E simulation
on:
  push:
    branches:
      - fb-launch13-e2e-launch-simulation

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Full launch simulation
        run: npm test
