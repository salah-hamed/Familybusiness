name: FB-LAUNCH07A validation
on:
  push:
    branches:
      - fb-launch07a-operator-stale-alerts

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Syntax checks
        run: |
          node --check core/orders/operational-alerts.js
          node --check supermarket-operator/app.js
          node --check restaurant-operator/app.js
          node --check bakery-operator/app.js
          node --check laundry-operator/app.js
      - name: Full test suite
        run: npm test
