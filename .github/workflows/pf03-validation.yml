name: FB-PF03 Validation

on:
  push:
    branches:
      - fb-pf03-earnings-ledger-pagination
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax check PF03
        run: |
          node --check core/commissions/earnings-service.js
          node --check workspace/app.js
      - name: Run full test suite
        run: npm test
