name: FB-SM02 Validation

on:
  push:
    branches:
      - fb-sm02-master-catalog-2000-daily-home
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax check master catalog and customer home
        run: |
          node --check core/supermarket/master-catalog-data.js
          node --check core/supermarket/master-catalog.js
          node --check core/supermarket/catalog-view-model.js
          node --check supermarket-operator/products.js
          node --check templates/supermarket/app.js
      - name: Run full test suite
        run: npm test
