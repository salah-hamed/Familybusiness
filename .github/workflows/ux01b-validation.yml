name: FB-UX01B Validation

on:
  push:
    branches:
      - fb-ux01b-embedded-guidance
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax check embedded guide
        run: |
          node --check core/onboarding/guide.js
          node --check core/onboarding/guide-state.js
          node --check app.js
          node --check home/app.js
          node --check workspace/app.js
          node --check supermarket/app.js
          node --check restaurant/app.js
          node --check bakery/app.js
          node --check laundry/app.js
      - name: Run full test suite
        run: npm test
