name: FB-PF03 validation

on:
  push:
    branches:
      - fb-pf03-corrective-ledger-pagination
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Syntax checks
        run: |
          node --check core/commissions/earnings-service.js
          node --check tests/earnings-query.test.mjs
          node --check tests/source-regressions.test.mjs
          node --check workspace/app.js

      - name: Full test suite
        run: npm test
