name: Export Firebase Stabilization Files

on:
  push:
    branches:
      - fb-fs01-security-critical-correctness
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Firebase files
        uses: actions/upload-artifact@v4
        with:
          name: family-business-firebase-stabilization
          path: |
            firestore.rules
            firestore.indexes.json
          if-no-files-found: error
          retention-days: 1
