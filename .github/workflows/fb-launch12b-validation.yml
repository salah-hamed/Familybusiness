name: FB-LAUNCH12B validation
on:
  push:
    branches:
      - fb-launch12b-referral-growth-platform-whatsapp

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax and config checks
        run: |
          node --check app.js
          node --check home/app.js
          node --check workspace/app.js
          node --check admin/admin.js
          node --check core/config/platform-config.js
      - name: Full test suite
        run: npm test
