name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security-hardening-prelaunch]

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm install --ignore-scripts

      - name: Full regression + Firestore Rules + E2E
        run: npm test

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
