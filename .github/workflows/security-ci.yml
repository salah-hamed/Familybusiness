name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security-hardening-prelaunch]

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm install --ignore-scripts

      - name: Safe HTML gate
        run: npm run test:safe-html

      - name: Source security and regression gate
        run: npm run test:source

      - name: Firestore Rules and E2E gate
        run: npm run test:rules

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
