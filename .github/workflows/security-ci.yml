name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security-hardening-prelaunch]

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm install --ignore-scripts

      - name: Safe HTML gate
        run: npm run test:safe-html

      - name: Source security and regression gate
        run: npm run test:source

      - name: Firestore core Rules gate
        run: npx firebase emulators:exec --project family-business-rules-test --only firestore "node --test --test-concurrency=1 tests/firestore.rules.test.mjs"

      - name: Firestore query gates
        run: npx firebase emulators:exec --project family-business-rules-test --only firestore "node --test --test-concurrency=1 tests/order-query.test.mjs tests/earnings-query.test.mjs tests/admin-users-pagination.test.mjs"

      - name: Launch E2E gate
        run: npx firebase emulators:exec --project family-business-rules-test --only firestore "node --test --test-concurrency=1 tests/launch-e2e-simulation.test.mjs"

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
