name: FB-PF06 validation

on:
  push:
    branches:
      - fb-pf06-food-menu-read-optimization
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Syntax checks
        run: |
          node --check core/restaurant/menu-service.js
          node --check restaurant-operator/menu.js
          node --check bakery-operator/menu.js
          node --check tests/source-regressions.test.mjs

      - name: Full test suite
        run: npm test
