name: FB-LAUNCH01 Commission Trigger Validation
on:
  push:
    branches:
      - fb-launch01-commission-on-dispatch

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node --check core/supermarket/order-service.js
      - run: node --check core/restaurant/order-service.js
      - run: node --check core/laundry/order-service.js
      - run: node --check tests/firestore.rules.test.mjs
      - run: node --check tests/billing-commission-integrity.test.mjs
      - run: node --check tests/source-regressions.test.mjs
      - run: npm test
