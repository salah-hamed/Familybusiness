name: Check Firebase Deploy Credential

on:
  push:
    branches:
      - fix-prod-firestore-index-deploy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check credential availability
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          found=0
          for name in FIREBASE_TOKEN GOOGLE_APPLICATION_CREDENTIALS_JSON FIREBASE_SERVICE_ACCOUNT GCP_SA_KEY; do
            if [ -n "${!name}" ]; then
              echo "$name=present"
              found=1
            else
              echo "$name=missing"
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "No deploy credential is configured."
            exit 2
          fi
