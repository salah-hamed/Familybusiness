name: FB-PF05 validation

on:
  push:
    branches:
      - fb-pf05-supermarket-catalog-read-optimization
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Syntax checks
        run: |
          node --check core/supermarket/catalog-service.js
          node --check supermarket-operator/products.js
          node --check tests/supermarket-catalog.test.mjs

      - name: Full test suite
        run: npm test
