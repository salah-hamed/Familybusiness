name: FB-LAUNCH02 Production Rules Compatibility
on:
  push:
    branches:
      - fb-launch02-prod-rules-compat
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node --check admin/admin.js
      - run: node --check tests/source-regressions.test.mjs
      - run: npm test
