name: FB-PF02 Validation

on:
  push:
    branches:
      - fb-pf02-admin-users-pagination
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax check PF02
        run: |
          node --check admin/admin.js
          node --check core/config/platform-config.js
      - name: Run full test suite
        run: npm test
