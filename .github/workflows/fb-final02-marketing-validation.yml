name: FB-FINAL02 Marketing Validation
on:
  push:
    branches:
      - fb-final02-marketing-income-story

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node --check home/app.js
      - run: node --check tests/source-regressions.test.mjs
      - run: npm test
