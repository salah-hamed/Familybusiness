name: FB-FINAL04 Workspace Validation
on:
  push:
    branches:
      - fb-final04-workspace-owner-unification

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node --check workspace/app.js
      - run: node --check supermarket/app.js
      - run: node --check restaurant/app.js
      - run: node --check bakery/app.js
      - run: node --check laundry/app.js
      - run: node --check tests/source-regressions.test.mjs
      - run: npm test
