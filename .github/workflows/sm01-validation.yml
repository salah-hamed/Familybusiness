name: FB-SM01 Validation

on:
  push:
    branches:
      - fb-sm01-unified-supermarket-catalog
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax check supermarket catalog
        run: |
          node --check core/supermarket/catalog-view-model.js
          node --check supermarket-operator/products.js
          node --check templates/supermarket/app.js
          node --check core/supermarket/catalog-service.js
      - name: Run full test suite
        run: npm test
