name: FB-LAUNCH12C validation
on:
  push:
    branches:
      - fb-launch12c-hide-platform-whatsapp-number

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax checks
        run: |
          node --check app.js
          node --check home/app.js
          node --check core/config/platform-config.js
      - name: Full test suite
        run: npm test
