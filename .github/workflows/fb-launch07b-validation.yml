name: FB-LAUNCH07B validation
on:
  push:
    branches:
      - fb-launch07b-admin-operational-exceptions

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax and index checks
        run: |
          node --check admin/admin.js
          node --check core/orders/operational-alerts.js
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8')); console.log('indexes ok')"
      - name: Full test suite
        run: npm test
