name: FB-FS02 Validation

on:
  push:
    branches:
      - fb-fs02-operator-access-recovery
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax check operator recovery
        run: |
          node --check core/partners/partner-service.js
          node --check supermarket/app.js
          node --check restaurant/app.js
          node --check bakery/app.js
          node --check laundry/app.js
          node --check supermarket-operator/app.js
          node --check supermarket-operator/products.js
          node --check restaurant-operator/app.js
          node --check restaurant-operator/menu.js
          node --check bakery-operator/app.js
          node --check bakery-operator/menu.js
          node --check laundry-operator/app.js
      - name: Run full test suite
        run: npm test
