name: FB-FS04 Validation

on:
  push:
    branches:
      - fb-fs04-commission-integrity-billing
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: Syntax check commission integrity
        run: |
          node --check core/config/platform-config.js
          node --check core/commissions/commission-service.js
          node --check core/supermarket/order-service.js
          node --check core/restaurant/order-service.js
          node --check core/laundry/order-service.js
          node --check admin/admin.js
          node --check core/onboarding/guide-state.js
      - name: Run full test suite
        run: npm test
