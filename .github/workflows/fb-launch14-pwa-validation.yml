name: FB-LAUNCH14 PWA validation
on:
  push:
    branches:
      - fb-launch14-pwa-installable-apps

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - name: PWA syntax and manifest checks
        run: |
          node --check pwa/install.js
          node --check service-worker.js
          node -e "for (const f of ['pwa/manifest.json','pwa/manifests/workspace.webmanifest','pwa/manifests/admin.webmanifest','pwa/manifests/supermarket.webmanifest','pwa/manifests/restaurant.webmanifest','pwa/manifests/bakery.webmanifest','pwa/manifests/laundry.webmanifest']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('manifests ok')"
          node --test tests/pwa-installability.test.mjs
      - name: Full test suite
        run: npm test
