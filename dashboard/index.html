<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>لوحة التحكم | Family Business</title>
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body>

<div class="dashboardShell">

  <header class="dashboardHeader" id="homeSection">
    <div>
      <span class="eyebrow">لوحة إدارة مشروعك</span>
      <h1 id="userName">مشروعك</h1>
      <div class="projectMeta">
        <span id="projectType"></span>
        <span id="status" class="statusPill"></span>
      </div>
      <p id="userEmail" class="muted"></p>
    </div>

    <button id="logoutBtn" class="iconBtn dangerBtn" type="button">تسجيل الخروج</button>
  </header>

  <main class="dashboardMain">

    <section class="card quickCard">
      <div class="sectionHeading compactHeading">
        <div>
          <span class="eyebrow">رابط العميل</span>
          <h2>شارك مشروعك وابدأ استقبال الطلبات</h2>
        </div>
      </div>

      <div class="projectLinkBox">
        <input id="projectLink" readonly aria-label="رابط المشروع">
      </div>

      <div class="quickActions">
        <button id="openProjectBtn" class="primaryBtn" type="button">فتح واجهة العميل</button>
        <button id="copyLinkBtn" class="secondaryBtn" type="button">نسخ الرابط</button>
        <button id="shareProjectBtn" class="secondaryBtn" type="button">مشاركة المشروع</button>
      </div>

      <p id="copyStatus" class="statusText"></p>
    </section>

    <section class="statsSection">
      <div class="sectionHeading">
        <div>
          <span class="eyebrow">نظرة سريعة</span>
          <h2>أداء الطلبات</h2>
        </div>
      </div>

      <div class="statGrid">
        <article class="statCard accentNew">
          <span class="statIcon">🆕</span>
          <div>
            <span class="statLabel">طلبات جديدة</span>
            <strong id="newOrders">0</strong>
          </div>
        </article>

        <article class="statCard accentAccepted">
          <span class="statIcon">✅</span>
          <div>
            <span class="statLabel">مقبولة</span>
            <strong id="acceptedOrders">0</strong>
          </div>
        </article>

        <article class="statCard accentDone">
          <span class="statIcon">✨</span>
          <div>
            <span class="statLabel">منفذة</span>
            <strong id="doneOrders">0</strong>
          </div>
        </article>

        <article class="statCard accentCanceled">
          <span class="statIcon">⛔</span>
          <div>
            <span class="statLabel">ملغية</span>
            <strong id="canceledOrders">0</strong>
          </div>
        </article>

        <article class="statCard wideStat">
          <span class="statIcon">📅</span>
          <div>
            <span class="statLabel">طلبات اليوم</span>
            <strong id="todayOrders">0</strong>
          </div>
        </article>

        <article class="statCard wideStat revenueStat">
          <span class="statIcon">💰</span>
          <div>
            <span class="statLabel">قيمة الطلبات المنفذة</span>
            <strong><span id="doneRevenue">0</span> جنيه</strong>
          </div>
        </article>
      </div>
    </section>

    <section class="card" id="ordersSection">
      <div class="sectionHeading">
        <div>
          <span class="eyebrow">إدارة التشغيل</span>
          <h2>الطلبات</h2>
        </div>
      </div>

      <div class="searchBox">
        <span>🔎</span>
        <input id="ordersSearch" type="search" placeholder="ابحث باسم العميل أو رقم الهاتف">
      </div>

      <div id="tabs" class="tabsScroller">
        <button class="tabBtn active" data-tab="all" type="button">الكل</button>
        <button class="tabBtn" data-tab="new" type="button">جديدة</button>
        <button class="tabBtn" data-tab="accepted" type="button">مقبولة</button>
        <button class="tabBtn" data-tab="done" type="button">منفذة</button>
        <button class="tabBtn" data-tab="canceled" type="button">ملغية</button>
      </div>

      <div id="ordersContainer" class="ordersList"></div>
    </section>

    <section class="card" id="settingsSection">
      <div class="sectionHeading">
        <div>
          <span class="eyebrow">تخصيص المشروع</span>
          <h2>إعدادات المشروع</h2>
        </div>
      </div>

      <div class="formGrid">
        <label class="fieldGroup">
          <span>اسم النشاط</span>
          <input id="businessName" placeholder="اسم نشاطك">
        </label>

        <label class="fieldGroup">
          <span>رقم واتساب</span>
          <input id="whatsappNumber" inputmode="tel" placeholder="رقم واتساب">
        </label>

        <label class="fieldGroup fullField">
          <span>رابط InstaPay</span>
          <input id="instapayLink" placeholder="رابط الدفع">
        </label>
      </div>

      <button id="saveSettingsBtn" class="primaryBtn fullBtn" type="button">حفظ إعدادات المشروع</button>
      <p id="settingsStatus" class="statusText"></p>
    </section>

    <section class="card" id="pricingSection">
      <div class="sectionHeading">
        <div>
          <span class="eyebrow">تحكم كامل</span>
          <h2>تسعير الخدمة</h2>
        </div>
      </div>

      <div class="formGrid pricingGrid">
        <label class="fieldGroup">
          <span>السعر الأساسي</span>
          <input id="basePrice" inputmode="decimal" placeholder="0">
        </label>

        <label class="fieldGroup">
          <span>سعر الغرفة</span>
          <input id="roomPrice" inputmode="decimal" placeholder="0">
        </label>

        <label class="fieldGroup">
          <span>سعر الحمام</span>
          <input id="bathroomPrice" inputmode="decimal" placeholder="0">
        </label>

        <label class="fieldGroup">
          <span>سعر المطبخ</span>
          <input id="kitchenPrice" inputmode="decimal" placeholder="0">
        </label>

        <label class="fieldGroup fullField">
          <span>سعر تنظيف السلم</span>
          <input id="stairsPrice" inputmode="decimal" placeholder="0">
        </label>
      </div>

      <button id="savePricingBtn" class="primaryBtn fullBtn" type="button">حفظ الأسعار</button>
      <p id="pricingStatus" class="statusText"></p>
    </section>

  </main>

  <nav class="bottomNav" aria-label="تنقل لوحة التحكم">
    <button class="navItem active" data-target="homeSection" type="button"><span>🏠</span><small>الرئيسية</small></button>
    <button class="navItem" data-target="ordersSection" type="button"><span>📦</span><small>الطلبات</small></button>
    <button class="navItem" data-target="settingsSection" type="button"><span>⚙️</span><small>الإعدادات</small></button>
  </nav>

</div>

<script type="module" src="./dashboard.js"></script>
</body>
</html>
